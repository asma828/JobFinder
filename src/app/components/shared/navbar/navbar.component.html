<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/home">
      <i class="bi bi-briefcase-fill me-2"></i>
      JobFinder
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="!isMenuCollapsed">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">
            <i class="bi bi-house-fill me-1"></i>
            Accueil
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/jobs" routerLinkActive="active" (click)="closeMenu()">
            <i class="bi bi-search me-1"></i>
            Rechercher
          </a>
        </li>

        <!-- Authenticated User Menu -->
        <ng-container *ngIf="currentUser">
          <li class="nav-item">
            <a class="nav-link" routerLink="/favorites" routerLinkActive="active" (click)="closeMenu()">
              <i class="bi bi-star-fill me-1"></i>
              Favoris
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/applications" routerLinkActive="active" (click)="closeMenu()">
              <i class="bi bi-file-earmark-text-fill me-1"></i>
              Candidatures
            </a>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i>
              {{ currentUser.firstName }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" routerLink="/profile" (click)="closeMenu()">
                  <i class="bi bi-person-fill me-2"></i>
                  Mon Profil
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item text-danger" href="#" (click)="logout(); closeMenu()">
                  <i class="bi bi-box-arrow-right me-2"></i>
                  Déconnexion
                </a>
              </li>
            </ul>
          </li>
        </ng-container>

        <!-- Guest Menu -->
        <ng-container *ngIf="!currentUser">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active" (click)="closeMenu()">
              <i class="bi bi-box-arrow-in-right me-1"></i>
              Connexion
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link btn btn-light text-primary ms-lg-2" routerLink="/register" (click)="closeMenu()">
              <i class="bi bi-person-plus-fill me-1"></i>
              Inscription
            </a>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>
