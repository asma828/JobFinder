<app-navbar></app-navbar>

<div class="auth-container">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">

        <div class="card auth-card border-0">
          <div class="card-body auth-card-body">

            <!-- Header -->
            <div class="auth-header">
              <div class="auth-icon">
                <i class="bi bi-box-arrow-in-right"></i>
              </div>
              <h2 class="auth-title">Connexion</h2>
              <p class="auth-subtitle">Accédez à votre espace JobFinder</p>
            </div>

            <!-- Error -->
            <div class="alert alert-danger mb-4" role="alert" *ngIf="errorMessage">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              {{ errorMessage }}
            </div>

            <!-- Form -->
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

              <div class="mb-4">
                <label for="email" class="field-label">
                  <i class="bi bi-envelope-fill"></i> Email
                </label>
                <input
                  type="email"
                  class="form-control form-control-lg"
                  id="email"
                  formControlName="email"
                  [class.is-invalid]="email?.invalid && email?.touched"
                  [class.is-valid]="email?.valid && email?.touched"
                  placeholder="votre.email@example.com">
                <div class="invalid-feedback" *ngIf="email?.invalid && email?.touched">
                  <span *ngIf="email?.errors?.['required']">L'email est requis.</span>
                  <span *ngIf="email?.errors?.['email']">Email invalide.</span>
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="field-label">
                  <i class="bi bi-lock-fill"></i> Mot de passe
                </label>
                <input
                  type="password"
                  class="form-control form-control-lg"
                  id="password"
                  formControlName="password"
                  [class.is-invalid]="password?.invalid && password?.touched"
                  [class.is-valid]="password?.valid && password?.touched"
                  placeholder="••••••••">
                <div class="invalid-feedback" *ngIf="password?.invalid && password?.touched">
                  <span *ngIf="password?.errors?.['required']">Le mot de passe est requis.</span>
                  <span *ngIf="password?.errors?.['minlength']">Minimum 6 caractères.</span>
                </div>
              </div>

              <!-- Test credentials -->
              <div class="test-creds mb-4">
                Compte de test :
                <a href="#" (click)="fillTestCredentials(); $event.preventDefault()">
                  Remplir automatiquement
                </a>
              </div>

              <button
                type="submit"
                class="btn-auth"
                [disabled]="isLoading">
                <ng-container *ngIf="!isLoading">
                  <i class="bi bi-box-arrow-in-right"></i>
                  Se connecter
                </ng-container>
                <ng-container *ngIf="isLoading">
                  <span class="spinner-border spinner-border-sm" role="status"></span>
                  Connexion en cours...
                </ng-container>
              </button>

              <div class="auth-switch">
                Pas encore de compte ?
                <a routerLink="/register">S'inscrire</a>
              </div>

            </form>
          </div>
        </div>

        <a routerLink="/home" class="back-link">
          <i class="bi bi-arrow-left"></i>
          Retour à l'accueil
        </a>

      </div>
    </div>
  </div>
</div>
