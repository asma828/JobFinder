<div class="job-card card border-0 shadow-sm h-100">
  <div class="card-body p-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div class="flex-grow-1">
        <h5 class="fw-bold mb-2">
          <i class="bi bi-briefcase-fill text-primary me-2"></i>
          {{ job.title }}
        </h5>
        <h6 class="text-muted mb-0">
          <i class="bi bi-building me-2"></i>
          {{ job.company }}
        </h6>
      </div>

      <span class="badge bg-{{ getApiSourceBadge().color }}">
        {{ getApiSourceBadge().text }}
      </span>
    </div>

    <!-- Details -->
    <div class="mb-3">
      <p class="mb-1">
        <i class="bi bi-geo-alt-fill text-danger me-2"></i>
        {{ job.location }}
      </p>

      <p class="mb-1" *ngIf="job.created">
        <i class="bi bi-calendar-fill text-success me-2"></i>
        <small>{{ formatDate(job.created) }}</small>
      </p>

      <p class="mb-1" *ngIf="job.salary_min || job.salary_max">
        <i class="bi bi-currency-euro text-warning me-2"></i>
        {{ formatSalary() }}
      </p>
    </div>

    <!-- Description -->
    <p class="text-muted small mb-3">
      {{ getShortDescription() }}
    </p>

    <!-- Actions -->
    <div class="d-flex flex-wrap gap-2">

      <button class="btn btn-primary flex-grow-1" (click)="viewJob()">
        <i class="bi bi-box-arrow-up-right me-1"></i>
        Voir l'offre
      </button>

      <!--  FAVORITE BUTTON -->
      <ng-container *ngIf="{ isFav: isFavorite$ | async } as state">
        <button
          class="btn"
          [class.btn-warning]="state.isFav"
          [class.btn-outline-warning]="!state.isFav"
          [class.text-white]="state.isFav"
          (click)="toggleFavorite(!!state.isFav)"
          [title]="isAuthenticated
      ? (state.isFav ? 'Retirer des favoris' : 'Ajouter aux favoris')
      : 'Connectez-vous pour ajouter aux favoris'">
          <i class="bi"
             [class.bi-star-fill]="state.isFav"
             [class.bi-star]="!state.isFav"></i>
        </button>
      </ng-container>

      <button class="btn btn-outline-success" (click)="addToApplications()">
        <i class="bi bi-file-earmark-plus"></i>
      </button>
    </div>

    <!-- Auth warning -->
    <div *ngIf="!isAuthenticated" class="alert alert-info mt-3 small mb-0">
      <i class="bi bi-info-circle-fill me-1"></i>
      <a routerLink="/login" class="alert-link">Connectez-vous</a>
      pour ajouter aux favoris
    </div>

  </div>
</div>
