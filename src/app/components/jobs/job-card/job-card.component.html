<div class="job-card card border-0 h-100">
  <div class="card-body">

    <!-- Header -->
    <div class="job-header">
      <div class="job-company-logo">
        <i class="bi bi-building"></i>
      </div>

      <div class="job-title-group">
        <div class="job-title">{{ job.title }}</div>
        <div class="job-company">
          <i class="bi bi-building"></i>
          {{ job.company }}
        </div>
      </div>

      <span class="source-badge">{{ getApiSourceBadge().text }}</span>
    </div>

    <!-- Details -->
    <div class="job-details">
      <div class="job-detail-item">
        <i class="bi bi-geo-alt-fill location"></i>
        <span>{{ job.location }}</span>
      </div>

      <div class="job-detail-item" *ngIf="job.created">
        <i class="bi bi-calendar2-fill date"></i>
        <span>{{ formatDate(job.created) }}</span>
      </div>

      <div class="job-detail-item" *ngIf="job.salary_min || job.salary_max">
        <i class="bi bi-currency-euro salary"></i>
        <span>{{ formatSalary() }}</span>
      </div>
    </div>

    <!-- Description -->
    <p class="job-description">{{ getShortDescription() }}</p>

    <hr class="job-divider">

    <!-- Actions -->
    <div class="job-actions">

      <!-- View -->
      <button class="btn-view" (click)="viewJob()">
        <i class="bi bi-box-arrow-up-right"></i>
        Voir l'offre
      </button>

      <!-- Favorite -->
      <ng-container *ngIf="{ isFav: isFavorite$ | async } as state">
        <button
          class="btn-icon"
          [class.fav-active]="state.isFav"
          [class.fav-inactive]="!state.isFav"
          (click)="toggleFavorite(!!state.isFav)"
          [title]="isAuthenticated
            ? (state.isFav ? 'Retirer des favoris' : 'Ajouter aux favoris')
            : 'Connectez-vous pour ajouter aux favoris'">
          <i class="bi"
             [class.bi-star-fill]="state.isFav"
             [class.bi-star]="!state.isFav"></i>
        </button>
      </ng-container>

      <!-- Apply -->
      <button class="btn-icon apply-btn"
              (click)="addToApplications()"
              title="Ajouter aux candidatures">
        <i class="bi bi-file-earmark-plus"></i>
      </button>

    </div>

    <!-- Auth hint -->
    <div *ngIf="!isAuthenticated" class="auth-hint">
      <i class="bi bi-lock-fill me-1"></i>
      <a routerLink="/login">Connectez-vous</a> pour sauvegarder cette offre
    </div>

  </div>
</div>
